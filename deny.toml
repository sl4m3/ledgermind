[advisories]
version = 2

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
    "LicenseRef-LedgerMind-Internal",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    "async-std",
    "async-std-resolver",
    "attohttpc",
    "curl",
    "curl-sys",
    "hickory-resolver",
    "hyper",
    "isahc",
    "mio",
    "native-tls",
    "openssl",
    "openssl-sys",
    "quinn",
    "reqwest",
    "rustls",
    "smol",
    "socket2",
    "surf",
    "tokio",
    "trust-dns-resolver",
    "ureq",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
