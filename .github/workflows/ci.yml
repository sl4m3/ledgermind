name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: protocol and integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pytest
        run: |
          uv run --no-project \
            --with-editable ./protocol/python \
            --with-editable ./integrations \
            --with pytest --with jsonschema \
            python -m pytest -q protocol/python/tests integrations/tests

  local:
    name: local product
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install bubblewrap
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bubblewrap
      # The proprietary inference boundary ships as a binary wheel asset; its
      # name and digest are recorded in local/release/dependency-wheels.json.
      - name: fetch ledgermind-inference wheel
        run: |
          mkdir -p wheels
          curl -fsSL -o wheels/ledgermind_inference-0.1.0-py3-none-any.whl \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v4.1.0/ledgermind_inference-0.1.0-py3-none-any.whl"
      - name: test-all
        env:
          LEDGERMIND_INFERENCE_WHEEL: ${{ github.workspace }}/wheels/ledgermind_inference-0.1.0-py3-none-any.whl
        run: ./tools/test-all.sh
