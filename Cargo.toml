[workspace]
members = [
    "crates/ledgermind-domain",
    "crates/ledgermind-application",
    "crates/ledgermind-storage-sqlite",
    "crates/ledgermind-protocol",
    "crates/ledgermind-daemon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "LicenseRef-LedgerMind-Internal"

[workspace.dependencies]
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
